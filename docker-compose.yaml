services:
  wallos:
    container_name: wallos
    build: .
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'Europe/Brussels'
    # Volumes store your data between container upgrades
    volumes:
      - 'wallos_db:/var/www/html/db'
      - 'wallos_logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped

volumes:
  wallos_db:
  wallos_logos:
